name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Three compilers, three standard libraries, two operating systems. A book
  # that reconstructs correctly under one toolchain and not another has
  # undefined behaviour in it, and the whole point of this library is that its
  # output is bit-identical everywhere.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-release
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Release
          - name: linux-gcc-debug
            os: ubuntu-latest
            cc: gcc
            cxx: g++
            build_type: Debug
          - name: linux-clang-release
            os: ubuntu-latest
            cc: clang
            cxx: clang++
            build_type: Release
          - name: macos-clang-release
            os: macos-latest
            cc: clang
            cxx: clang++
            build_type: Release
          - name: windows-msvc-release
            os: windows-latest
            build_type: Release

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCROSSBOOK_BUILD_TESTS=ON
          -DCROSSBOOK_WERROR=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure

  # Determinism is a cross-platform claim, so it is checked on every platform
  # rather than asserted in a README.
  determinism:
    name: determinism-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCROSSBOOK_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Determinism and equivalence suites
        run: >
          ctest --test-dir build --build-config Release --output-on-failure
          -R "determinism|equivalence|checksum"

  sanitizers:
    name: sanitizers (asan+ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCROSSBOOK_BUILD_TESTS=ON
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  fuzz:
    name: fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build-fuzz
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCROSSBOOK_BUILD_TESTS=OFF
          -DCROSSBOOK_BUILD_FUZZ=ON
      - name: Build
        run: cmake --build build-fuzz --parallel
      # A short run per target on every PR. This is a regression gate, not a
      # fuzzing campaign: it catches an input class a change has newly broken.
      # Long campaigns run out of band and their corpora get committed.
      - name: Fuzz parse_fixed
        run: ./build-fuzz/fuzz/fuzz_parse_fixed -max_total_time=45 -print_final_stats=1
      - name: Fuzz book (differential against std::map)
        run: ./build-fuzz/fuzz/fuzz_book -max_total_time=60 -print_final_stats=1
      - name: Fuzz sequence state machine
        run: ./build-fuzz/fuzz/fuzz_sequence -max_total_time=45 -print_final_stats=1
      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

  # Advisory until the tree has been normalised with a pinned clang-format
  # version. A formatting job that fails on a version difference teaches people
  # to ignore red builds, which is a worse outcome than inconsistent braces.
  format:
    name: clang-format (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: |
          files=$(find include tests bench fuzz \
            \( -name '*.hpp' -o -name '*.cpp' \) 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "No sources found; nothing to check."
            exit 0
          fi
          echo "$files" | xargs clang-format --dry-run --Werror
